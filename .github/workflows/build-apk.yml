name: Build TV Box APK

on:
  push:
    branches: [main]
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kiosk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk vlenchu-tvbox.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlenchu-tvbox-apk
          path: android-kiosk/vlenchu-tvbox.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tvbox-latest
          name: Vlenchu - Reproductor TV Box (APK)
          body: |
            App Android liviana **Vlenchu** para TV Box (pantalla completa, autoarranque, cierre con doble toque de ATRÁS o botón MENÚ del control remoto).
          files: android-kiosk/vlenchu-tvbox.apk
